services:
  freqtrade:
    # Freqtrade official image pinned to version 2026.7
    image: freqtradeorg/freqtrade:2026.7
    container_name: freqtrade-vibe-strategies
    restart: "no"
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Read-only mounts for strategies and example configs
      - ./strategies:/freqtrade/user_data/strategies:ro
      - ./config:/freqtrade/user_data/config:ro
      # Read-write mounts for persistent data, backtest results, and dry-run database
      - ./user_data/data:/freqtrade/user_data/data
      - ./user_data/backtest_results:/freqtrade/user_data/backtest_results
      - ./user_data/db:/freqtrade/user_data/db
    command: --version
