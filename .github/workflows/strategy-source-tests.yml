name: Strategy source tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: strategy-source-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository checks
        shell: pwsh
        run: ./scripts/Invoke-Checks.ps1

      - name: Verify strategies loading in official Freqtrade Docker image
        run: docker compose run --rm freqtrade list-strategies --strategy-path /freqtrade/user_data/strategies
