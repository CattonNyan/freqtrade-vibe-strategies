name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Strategy & Script Checks
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python Strategy Unit Tests
        run: |
          python -B -m unittest discover -s tests -v

      - name: Run PowerShell Tests
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File tests/Test-PowerShellScripts.ps1

      - name: Run Full Repository Checks
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/Invoke-Checks.ps1
